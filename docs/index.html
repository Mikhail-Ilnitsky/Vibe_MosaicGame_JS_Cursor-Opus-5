<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Игра-мозаика</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand" data-i18n="appTitle">Игра-мозаика</h1>
    <div class="lang" role="group" aria-label="RU / EN">
      <button type="button" class="lang-btn" data-lang="ru">RU</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
  </header>

  <main class="screens">
    <!-- 1. Галерея -->
    <section class="screen screen--gallery is-active" id="screen-gallery">
      <p class="screen__lead" data-i18n="galleryLead">Выберите картинку</p>
      <ul class="gallery" id="gallery"></ul>
    </section>

    <!-- 2. Выбор сложности -->
    <section class="screen screen--levels" id="screen-levels">
      <div class="screen__head">
        <button type="button" class="btn btn--ghost" id="levels-exit" data-i18n="exit">Выход</button>
        <p class="screen__lead" data-i18n="levelsLead">Выберите сложность</p>
      </div>
      <div class="preview" id="levels-preview"></div>
      <p class="hint" id="levels-hint" data-i18n="levelsHint">Деление по меньшей стороне</p>
      <ul class="levels" id="levels"></ul>
    </section>

    <!-- 3. Игра -->
    <section class="screen screen--game" id="screen-game">
      <div class="gamebar">
        <button type="button" class="btn btn--ghost" id="game-exit" data-i18n="exit">Выход</button>
        <p class="moves" id="moves"></p>
        <button type="button" class="btn btn--ghost" id="toggle-original" data-i18n="showOriginal">Показать оригинал</button>
      </div>
      <div class="board-area" id="board-area">
        <div class="board" id="board">
          <div class="board__original" id="board-original" aria-hidden="true"></div>
        </div>
      </div>
      <div class="win" id="win" aria-live="polite">
        <p class="win__title" data-i18n="winTitle">У вас получилось!</p>
        <p class="win__moves" id="win-moves"></p>
        <button type="button" class="btn btn--primary" id="new-game" data-i18n="newGame">Начать новую игру</button>
      </div>
    </section>
  </main>

  <div class="status" id="status" role="status"></div>

  <script src="./js/images.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/grid.js"></script>
  <script src="./js/game.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
